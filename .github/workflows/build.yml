name: Build and verify desktop apps
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            rid: win-x64
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.413
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check app version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          python scripts/version.py --check
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/version.py --check --tag "$RELEASE_TAG"
          fi
          python -m unittest discover -s scripts/tests -v
      - name: Install audio tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install audio tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install audio tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Build, test, and package
        run: python scripts/ci_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: SFXplore-${{ matrix.rid }}
          path: dist/SFXplore-*.tar.gz
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.rid }}
          path: Tests/TestResults/*.trx
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: SFXplore-*
          merge-multiple: true
          path: release-assets
      - name: Record tested artifacts and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py manifest release-assets --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          python -c 'import pathlib, os; v=os.environ["RELEASE_TAG"][1:]; text=pathlib.Path("CHANGELOG.md").read_text(); pathlib.Path("release-notes.md").write_text(text.split("\n## " + v + "\n",1)[1].split("\n## ",1)[0].strip() + "\n")'
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "SFXplore ${RELEASE_TAG#v}" --notes-file release-notes.md release-assets/*
