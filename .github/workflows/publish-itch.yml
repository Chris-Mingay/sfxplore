name: Publish tested release to itch.io
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tested release tag (for example v0.2.0)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: itch-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    environment: itch-production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download and verify the tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vX.Y.Z tag'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "RELEASE_COMMIT=$commit" >> "$GITHUB_ENV"
          gh release download "$RELEASE_TAG" --dir release-assets --pattern 'SFXplore-*.tar.gz' --pattern release-manifest.json
          run_id=$(python -c 'import json; print(int(json.load(open("release-assets/release-manifest.json"))["run_id"]))')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > build-run.json
          python scripts/release.py verify release-assets --tag "$RELEASE_TAG" --commit "$commit" --run-info build-run.json --repository "$GITHUB_REPOSITORY"
      - name: Install Butler
        run: |
          curl --fail --location --retry 3 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default --output "$RUNNER_TEMP/butler.zip"
          mkdir -p "$RUNNER_TEMP/butler"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish verified packages
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/release.py publish release-assets --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --run-info build-run.json --repository "$GITHUB_REPOSITORY" --target "$ITCH_TARGET"
